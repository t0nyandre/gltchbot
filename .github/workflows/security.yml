name: "Go Security Scanner"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * 1'  # Weekly at 2am Monday

jobs:
  gosec:
    name: Run gosec
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec with SARIF output
        run: |
          mkdir -p results
          gosec -fmt=sarif -out=results/gosec.sarif -confidence high -severity high -exclude="G107,G108,G204" ./...
        continue-on-error: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results/gosec.sarif
          wait-for-processing: true