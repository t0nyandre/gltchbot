services:
  postgres:
    image: postgres:17-alpine
    container_name: gltchbot-postgres-dev
    env_file: .env.dev
    environment:
      POSTGRES_DB: ${DB_NAME:-gltchbot}
      POSTGRES_USER: ${DB_USER:-gltchbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gltchbot} -d ${DB_NAME:-gltchbot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"
    networks:
      - gltchbot-network-dev

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: gltchbot-bot-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.dev
    environment:
      DB_HOST: postgres
    restart: "no"
    networks:
      - gltchbot-network-dev

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gltchbot-api-dev
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env.dev
    environment:
      DB_HOST: postgres
    ports:
      - "${API_PORT:-8080}:8080"
    restart: "no"
    networks:
      - gltchbot-network-dev

volumes:
  pgdata-dev:

networks:
  gltchbot-network-dev:
    driver: bridge
